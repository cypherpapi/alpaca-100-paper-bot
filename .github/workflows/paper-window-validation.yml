name: Gated paper operation and audit
on:
  schedule:
    - cron: '40 9 * * 1-5'
      timezone: America/New_York
  workflow_dispatch:
    inputs:
      supervised_test:
        description: 'Bound a manual ongoing-paper start to five minutes; skip closing handoff'
        type: boolean
        default: false
      ongoing_paper:
        description: 'Manually start the approved ongoing paper day; default remains read-only'
        type: boolean
        default: false
      audit_only:
        description: 'GET-only post-session positions and order audit'
        type: boolean
        default: false
      audit_after:
        description: 'Audit orders submitted after this ISO timestamp (within 24 hours)'
        type: string
        default: ''
      paper_test:
        description: 'Run the approved five-minute gated paper test (default is read-only)'
        type: boolean
        default: false
        required: true
permissions:
  contents: read
concurrency:
  group: alpaca-paper-bot
  cancel-in-progress: false
jobs:
  validate:
    if: ${{ github.event_name == 'workflow_dispatch' && !inputs.ongoing_paper }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Network-disabled tests and syntax checks
        run: npm test && npm run check
      - name: Gated account, data, strategy validation or approved bounded paper test
        env:
          TRADING_ENABLED: 'false'
          AUDIT_ONLY: ${{ inputs.audit_only }}
          AUDIT_AFTER: ${{ inputs.audit_after }}
          PAPER_TEST: ${{ inputs.paper_test }}
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
        run: |
          if [[ "$AUDIT_ONLY" == true && "$EVENT_NAME" == workflow_dispatch && "$REF" == refs/heads/main ]]; then
            node tools/audit-paper-account.mjs
          elif [[ "$PAPER_TEST" == true && "$EVENT_NAME" == workflow_dispatch && "$REF" == refs/heads/main ]]; then
            TRADING_ENABLED=true PAPER_RESTART_APPROVED=true SESSION_MAX_MINUTES=5 node tools/run-paper-restart.mjs --paper-orders
          else
            node tools/run-paper-restart.mjs
          fi
  morning:
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || inputs.ongoing_paper) }}
    env:
      PAPER_SUPERVISED_TEST: ${{ github.event_name == 'workflow_dispatch' && inputs.supervised_test && 'true' || 'false' }}
      ONGOING_PAPER_APPROVED: 'true'
      PAPER_RESTART_APPROVED: 'true'
      TRADING_ENABLED: 'true'
      ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
      ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
    runs-on: ubuntu-latest
    timeout-minutes: 220
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm test && npm run check
      - run: node tools/run-ongoing-paper.mjs morning
  closing:
    if: ${{ !inputs.supervised_test }}
    needs: morning
    env:
      PAPER_SUPERVISED_TEST: ${{ github.event_name == 'workflow_dispatch' && inputs.supervised_test && 'true' || 'false' }}
      ONGOING_PAPER_APPROVED: 'true'
      PAPER_RESTART_APPROVED: 'true'
      TRADING_ENABLED: 'true'
      ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
      ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm test && npm run check
      - run: node tools/run-ongoing-paper.mjs closing
