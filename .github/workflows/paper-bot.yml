name: Paper bot mock-only CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mock-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out code
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Network-disabled mock tests and syntax checks
        run: node --require ./tools/network-guard.cjs --test && npm run check
