name: Alpaca $100 Paper Bot

on:
  workflow_dispatch:
  schedule:
    - cron: "2/5 9-15 * * 1-5"
      timezone: "America/New_York"

permissions:
  contents: read

concurrency:
  group: alpaca-paper-bot
  cancel-in-progress: false

jobs:
  run-paper-bot:
    if: ${{ vars.BOT_ACTIVE == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
      ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
      TRADING_ENABLED: ${{ vars.TRADING_ENABLED }}
      UNIVERSE: TQQQ,SQQQ,SOXL,SOXS,TNA,TZA
      ALLOCATION_PCT: "0.90"
      STOP_LOSS_PCT: "0.02"
      TAKE_PROFIT_PCT: "0.03"
      DAILY_LOSS_LIMIT_PCT: "0.04"
      MAX_ENTRIES_PER_DAY: "4"
      REENTRY_COOLDOWN_MINUTES: "15"
      ENTRY_START_ET: "09:45"
      ENTRY_END_ET: "14:30"
      FORCE_EXIT_ET: "15:50"
    steps:
      - name: Check out bot
        uses: actions/checkout@v5
      - name: Run paper bot once
        run: node src/run-once.js
